artifacts = ["/app/targets.txt"]

[task]
name = "afterquery/pick-coring-targets"

[metadata]
author_name = "Inesh Reddy Chappidi"
author_email = "ineshhreddy249@gmail.com"

difficulty_explanation = """
Turning a gradiometer's raw logger dumps into a georeferenced mosaic and picking
targets off it is real and ordinary work. Archaeological geophysicists and the
survey teams of commercial units do it after every magnetometer survey, and
whoever inherits a survey from a contractor who has moved on does it from
exactly these leavings: a folder of dumps, the field sheets and the
specification the job was let to. The awkward parts of it here - an instrument
left on the wrong range, a surveyor who booked a grid by its centre, another who
wrote northing before easting, a third who logged at a finer sample interval -
are the ones a survey archive actually has in it rather than invented ones.

The data is synthetic and was built truth first. The compact anomalies of a
40-grid site were laid down before anything was surveyed, and the reading
over every half-metre cell follows from them. The logger dumps and the field
sheets were written afterwards, the way this job's five surveyors would have
walked and booked the grids. Every answer is therefore exact by construction
rather than a judgement made later, and the records are static files, so nothing
is computed at marking time.

Forty anomalies are each to be given the survey cell that holds the greatest
reading in a stated window of the site, marked exactly, and 36 of the
40 carry the task. Naming the middle of every window gets 0.

The arithmetic is not withheld. SPEC.md gives all of it: the size of a grid and
of a cell, the traverse and sample intervals, where a grid is begun, which
traverse is its first and that it is walked zig-zag, how a grid's position is
booked, how a cell is referenced, what a cell takes where the instrument logged
finer than the cell, the instrument's range, and how a peak is defined and ties
are broken. The work is in the doing. 76800
logged readings in 40 dumps have to be laid out as grids, the grids set in
their places on the site, and each window searched across the two grids it
spans; and the answer is a cell reference rather than a quantity, so there is
nothing to fit and nothing to regress. Taking the records exactly as they stand
locates 2 of 40.

Five things about the records have to be got from the records themselves. None
is written down anywhere, and each is settled by something in the records that
cannot be right otherwise.

The first is that one surveyor left the instrument on its tenth-of-a-nanotesla
range, so his grids read ten times everybody else's; the quiet ground between
anomalies, which reads alike all over the site, shows it.

The second is that one surveyor booked his grids by their centres where the
specification asks for the south-west corner, so that as booked they lie across
their neighbours, and forty grids no longer tile the block.

The third is that one surveyor booked northing before easting, which puts his
grids off the site altogether.

The fourth is that one surveyor logged at a quarter-metre sample interval, so
his dumps run to twice the length, and a cell takes the mean of the two readings
that fall in it, as the specification provides.

The fifth is not any surveyor's habit, and it is the one that decides the task.
The specification has every grid begun at its south-west corner. In the field a
surveyor begins a grid from whichever end he finished the last one at, and
16 of the 40 grids were begun from the north - four of the eight grids
of each of the four surveyors who strayed from the specification in other ways,
and none of the eight of the one who kept to it. No field sheet says which. A
grid begun from the north and laid out as if it had been begun from the south
comes out upside down, north for south. What settles it is the instrument. A
fluxgate gradiometer has a heading error: it reads a little high carried one way
and a little low carried the other, and SPEC.md records that nothing in the log
is corrected. So in every dump the first, third and fifth traverses stand apart
from the second, fourth and sixth - by at least 1.52 nT in every one of
the 40 grids, against a heading error of 2 nT from one way to the other.
Which way round they stand in a grid begun from the south is shown by the eight
grids of the surveyor who kept to the specification, which has every grid begun
at its south-west corner; a grid in which they stand the other way round was
begun from the north. SPEC.md does not mention the heading error: it is a
property of the instrument that anyone who has processed a zig-zag survey knows
by the stripes it leaves, and the stripes are in the dumps.
Taking every grid to have been begun where the specification says costs
18 of the 40 anomalies - and nothing goes visibly wrong for a
solver who does. Nothing on this site runs from one grid into the next, so a
grid laid out upside down meets its neighbours exactly as well as one laid out
aright: the mean step across a grid's north edge into its neighbour is 5.53 nT
laid out the right way about and 5.81 nT the wrong way. Every anomaly lies
well inside its grid, so upside down it is still a clean peak in the right grid
and the right traverse, only at the wrong northing, and every window keeps a
perfectly plausible answer. Unlike the four surveyors' habits, which can each be
checked against the grids of the surveyor who kept to the specification, there
is no clean set of grids for this one.

tests/gates.py scores all 64 ways of reading those five, together with
the one rule of the specification that is easy to leave out - that a grid is
walked zig-zag, so every second traverse runs the other way in the dump. Every
figure quoted here comes from its output. The whole account locates all
40. The best account that is not the whole one locates 32, so
missing any single one of them fails. The bar is 36, which leaves four
anomalies of room for a slip and still sits 4 clear of every partial
account. It also refuses to pass unless the heading error really does settle
which end every grid was begun from, and the surveyor who kept to the
specification began every one of his grids where it says, since a reading the records did not settle
would be a guess and not a finding; unless laying a grid out the wrong way about
makes it meet its neighbours no worse, so that there is nothing for a solver to
test a layout against; and unless the natural reading leaves no window empty, so
that the mistake does not announce itself.
"""

solution_explanation = """
solution/locate.py reads only what the agent's container carries and writes
/app/targets.txt. With solution/survey.py and solution/ref.py it is under three
hundred lines and imports nothing outside the standard library.

It reads the dumps, the field sheets and the list of anomalies, and finds the
surveyors' habits from the records rather than assuming them: the surveyor whose
quiet ground reads ten times everyone else's, the dumps that run to twice the
length, and - by trying each surveyor's bookings as they stand, by the centre
and with the columns exchanged until forty grids tile one block corner to
corner - the surveyor who booked centres and the one who booked northing first.
It puts each right. For every dump it then sets the mean of the first, third,
fifth traverses against the mean of the second, fourth, sixth. Which of the two
stands higher in a grid begun from the south it takes from the grids of the one
surveyor whose range, sample interval and bookings all keep to the
specification, since the specification has every grid begun at its south-west
corner; a grid in which they stand the other way round it takes to have been
begun from the north. It lays the grid out
accordingly, turning round every second traverse for the zig-zag. With the
mosaic assembled it takes, for each anomaly, the cell in its window with the
greatest reading, breaking ties to the west and then the south.

Every position is a whole number of decimetres and every reading is a whole
number or an exact fraction, so nothing anywhere turns on floating point and two
correct implementations must agree to the cell. Run against the shipped records
it locates 40 of 40.
"""

verification_explanation = """
The deliverable is a data file. The verifier reads /app/targets.txt and never
executes, imports or loads anything the submission wrote, so there is nothing to
sandbox and no way for a submission to influence its own score.

40 answers are marked, one for each anomaly, each a cell reference matched
exactly as text. 36 must be right. The sealed cells live only in the verifier
image at /tests/truth.json; the agent's container carries the specification, the
dumps, the field sheets and the list of anomalies, and nothing else. /tests is
mode 700 in the verifier image, set at build time so it holds under a read-only
root, and the agent's container has no mount of it at all; the verifier's log
directory is likewise unreachable from the agent's side.

There is nothing in the agent's container against which a solver could check an
answer. No anomaly's cell is attested anywhere, no total has to come out and
nothing has to balance, so a wrong set of cells is exactly as self-consistent as
the right one. The peaks have to be worked out; they cannot be searched for.

tests/gates.py is shipped and can be re-run. It scores all 64 readings
of the records against the sealed cells and refuses to pass if the whole account
does not locate every peak, if any other account reaches the bar, or if guessing
does. It reports the whole account at 40, the best account that is not it
at 32, the records taken as they stand at 2, and the middle
of every window at 0.

The records are static files from a seeded generator, so nothing is computed at
marking time and the answer cannot drift between runs. The reference was run
against the shipped bundle in the task's own container and located 40 of
40; an empty container scores 0.
"""

category = "Science"
subcategory = "Geophysics"
tags = ["geophysics", "magnetometry", "record-forensics", "raster", "python"]
expert_time_estimate_hours = 6
relevant_experience = """
Anyone who has had to process somebody else's magnetometer survey will know the
shape of this. The specification covers the ordinary case and the archive is
what five surveyors made it: one with the instrument on the wrong range, one
booking grids by their centres, one writing northing first, one logging at a
finer interval. Assembling dumps into a mosaic is the classic instance - a dump
is only a column of numbers, and where each reading belongs depends on how the
grid was walked, which the logger does not know and the field sheet seldom
says. Knowing that a fluxgate's heading error stripes a zig-zag survey, and
that the stripes say which way each traverse was walked, is ordinary knowledge
for anyone who has processed gradiometer data.
"""

